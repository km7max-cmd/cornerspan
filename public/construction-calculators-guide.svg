      <rect
        x="112"
        y="125"
        width="60"
        height="42"
        rx="9"
      />

      <rect
        x="189"
        y="125"
        width="60"
        height="42"
        rx="9"
      />

      <rect
        x="35"
        y="182"
        width="60"
        height="42"
        rx="9"
      />

      <rect
        x="112"
        y="182"
        width="60"
        height="42"
        rx="9"
      />

      <rect
        x="189"
        y="182"
        width="60"
        height="42"
        rx="9"
      />

      <rect
        x="35"
        y="239"
        width="60"
        height="42"
        rx="9"
