<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Construction Calculators</title>

  <desc id="desc">
    Construction calculator tools for measuring, estimating materials,
    roofing, brick, concrete, steel and landscaping projects.
  </desc>

  <defs>

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#eff6ff"
      />

      <stop
        offset="1"
        stop-color="#f8fafc"
      />
    </linearGradient>

    <linearGradient
      id="card"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0"
        stop-color="#ffffff"
      />

      <stop
        offset="1"
        stop-color="#f1f5f9"
      />
    </linearGradient>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1200"
    height="630"
    rx="42"
    fill="url(#background)"
  />


  <!-- BLUEPRINT GRID -->

  <g
    opacity=".28"
    stroke="#93c5fd"
    stroke-width="2"
  >

    <path d="M60 100H1140" />
    <path d="M60 170H1140" />
    <path d="M60 240H1140" />
    <path d="M60 310H1140" />
    <path d="M60 380H1140" />
    <path d="M60 450H1140" />
    <path d="M60 520H1140" />

    <path d="M130 55V575" />
    <path d="M230 55V575" />
    <path d="M330 55V575" />
    <path d="M430 55V575" />
    <path d="M530 55V575" />
    <path d="M630 55V575" />
    <path d="M730 55V575" />
    <path d="M830 55V575" />
    <path d="M930 55V575" />
    <path d="M1030 55V575" />

  </g>


  <!-- MAIN CARD -->

  <rect
    x="92"
    y="82"
    width="1016"
    height="466"
    rx="32"
    fill="url(#card)"
    stroke="#cbd5e1"
    stroke-width="3"
  />


  <!-- CALCULATOR -->

  <g transform="translate(155 142)">

    <rect
      width="285"
      height="320"
      rx="28"
