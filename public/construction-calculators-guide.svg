    <path d="M0 0h78v30H0z" />
    <path d="M82 0h78v30H82z" />

    <path d="M41 35h78v30H41z" />
    <path d="M123 35h78v30h-78z" />

    <path d="M0 70h78v30H0z" />
    <path d="M82 70h78v30H82z" />

    <path d="M41 105h78v30H41z" />
    <path d="M123 105h78v30h-78z" />

