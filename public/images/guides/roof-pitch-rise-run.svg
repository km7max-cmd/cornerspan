<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Roof pitch: 6 inches of rise over 12 inches of run</title>
  <desc id="desc">A right triangle with a 12-inch horizontal run and a 6-inch vertical rise. The 6:12 slope is 26.57 degrees above horizontal and 50 percent slope. Its area multiplier is 1.118034.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect x="0" width="1200" height="150" fill="#0f172a"/>
  <g font-family="Arial, sans-serif">
    <text x="50" y="53" fill="#93c5fd" font-size="20" font-weight="700" letter-spacing="3">CORNERSPAN / ROOF GEOMETRY</text>
    <text x="50" y="113" fill="#fff" font-size="43" font-weight="700">One slope. Three ways to describe it.</text>
    <path d="M90 490H650V210Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="6"/>
    <path d="M620 490V460H650" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M180 490A90 90 0 0 0 170.5 449.75" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <text x="194" y="463" fill="#1e3a8a" font-size="28" font-weight="700">26.57°</text>
    <path d="M90 524H650M90 514V534M650 514V534" stroke="#334155" stroke-width="3"/>
    <text x="370" y="566" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="700">12 in horizontal run</text>
    <path d="M685 210V490M675 210H695M675 490H695" stroke="#334155" stroke-width="3"/>
    <text x="712" y="350" fill="#0f172a" font-size="26" font-weight="700">6 in</text>
    <text x="712" y="384" fill="#475569" font-size="22">rise</text>
    <text x="280" y="346" transform="rotate(-26.565 280 346)" fill="#1e3a8a" font-size="23" font-weight="700">sloping roof length</text>
    <rect x="835" y="198" width="315" height="377" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="865" y="245" fill="#475569" font-size="20">PITCH</text>
    <text x="865" y="301" fill="#1d4ed8" font-size="52" font-weight="700">6:12</text>
    <path d="M865 323H1120" stroke="#e2e8f0" stroke-width="2"/>
    <text x="865" y="362" fill="#475569" font-size="20">SLOPE</text>
    <text x="865" y="407" fill="#0f172a" font-size="36" font-weight="700">50%</text>
    <text x="865" y="463" fill="#475569" font-size="20">AREA MULTIPLIER</text>
    <text x="865" y="510" fill="#0f172a" font-size="36" font-weight="700">1.118034×</text>
    <text x="50" y="630" fill="#475569" font-size="22">Run is horizontal. Use matching units before dividing rise by run.</text>
  </g>
</svg>
