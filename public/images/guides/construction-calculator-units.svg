<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>From measurements to whole cartons</title><desc>Keep feet, inches, area and purchased quantity distinct</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="675" fill="#f8fafc"/><text x="52" y="42" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">CORNERSPAN  /  FIELD NOTES</text><text x="52" y="104" font-size="36" fill="#10243a" font-weight="700" text-anchor="start">From measurements to whole cartons</text><text x="52" y="143" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Keep feet, inches, area and purchased quantity distinct</text><rect x="85" y="245" width="435" height="285" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="302" y="220" font-size="24" fill="#1d4ed8" font-weight="700" text-anchor="middle">11 ft 6 in = 11.5 ft</text><text x="302" y="350" font-size="28" fill="#1d4ed8" font-weight="700" text-anchor="middle">9 ft 4 in</text><text x="302" y="390" font-size="28" fill="#1d4ed8" font-weight="700" text-anchor="middle">= 9⅓ ft</text><text x="302" y="470" font-size="34" fill="#10243a" font-weight="700" text-anchor="middle">107⅓ sq ft</text><rect x="630" y="190" width="510" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="654" y="225" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Measured area</text><text x="654" y="260" font-size="21" fill="#475569" font-weight="400" text-anchor="start">11.5 × 9⅓ = 107⅓ sq ft</text><rect x="630" y="309" width="510" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="654" y="344" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">With example 8% allowance</text><text x="654" y="379" font-size="21" fill="#475569" font-weight="400" text-anchor="start">107⅓ × 1.08 = 115.92 sq ft</text><rect x="630" y="428" width="510" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="654" y="463" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Whole cartons: 15.5 sq ft each</text><text x="654" y="498" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Round up 115.92 ÷ 15.5 = 8</text><path d="M52 603 L1148 603" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="52" y="638" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Eight cartons provide 124 sq ft. Use the selected product’s coverage and project allowance.</text></g></svg>