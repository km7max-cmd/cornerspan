<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Count courses before ordering blocks</title><desc>Illustrative 18 in long × 8 in high module · drawing is a quantity worksheet</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="675" fill="#f8fafc"/><text x="52" y="42" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">CORNERSPAN  /  FIELD NOTES</text><text x="52" y="104" font-size="36" fill="#10243a" font-weight="700" text-anchor="start">Count courses before ordering blocks</text><text x="52" y="143" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Illustrative 18 in long × 8 in high module · drawing is a quantity worksheet</text><text x="72" y="211" font-size="25" fill="#10243a" font-weight="700" text-anchor="start">10 ft run = 120 in</text><text x="770" y="211" font-size="22" fill="#10243a" font-weight="700" text-anchor="start">Stock pieces to allow for cuts</text><rect x="72" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="159" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="246" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="333" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="420" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="507" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="594" y="240" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="72" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="159" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="246" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="333" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="420" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="507" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="594" y="299" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="72" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="159" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="246" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="333" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="420" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="507" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="594" y="358" width="83" height="52" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="72" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="159" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="246" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="333" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="420" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="507" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><rect x="594" y="417" width="83" height="52" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><path d="M60 414 L705 414" stroke="#c2410c" stroke-width="2" fill="none" stroke-dasharray="8 5"/><text x="780" y="283" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">3 exposed courses</text><text x="780" y="320" font-size="27" fill="#1d4ed8" font-weight="700" text-anchor="start">7 × 3 = 21 blocks</text><text x="780" y="391" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">1 assumed buried course</text><text x="780" y="428" font-size="26" fill="#c2410c" font-weight="700" text-anchor="start">+ 7 = 28 body blocks</text><text x="72" y="527" font-size="23" fill="#475569" font-weight="400" text-anchor="start">18 in stock module: round up 120 ÷ 18 = 7 pieces per course</text><text x="72" y="565" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Caps, cuts, bond and allowance are separate checks.</text><path d="M52 603 L1148 603" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="52" y="638" font-size="18" fill="#475569" font-weight="400" text-anchor="start">The buried course is an example assumption, not a wall design or embedment rule.</text></g></svg>