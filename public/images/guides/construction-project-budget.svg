<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Build the budget from priced scope</title><desc>Invented prices for arithmetic · unpriced work stays on a separate list</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="675" fill="#f8fafc"/><text x="52" y="42" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">CORNERSPAN  /  FIELD NOTES</text><text x="52" y="104" font-size="36" fill="#10243a" font-weight="700" text-anchor="start">Build the budget from priced scope</text><text x="52" y="143" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Invented prices for arithmetic · unpriced work stays on a separate list</text><text x="65" y="243" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">Materials</text><rect x="230" y="218" width="340" height="36" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="590" y="246" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">$584</text><text x="65" y="319" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">Delivery</text><rect x="230" y="294" width="49" height="36" rx="4" fill="#475569" stroke="#475569" stroke-width="2"/><text x="590" y="322" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">$85</text><text x="65" y="395" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">Labor</text><rect x="230" y="370" width="279" height="36" rx="4" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="590" y="398" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">$480</text><text x="65" y="471" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">Equipment</text><rect x="230" y="446" width="44" height="36" rx="4" fill="#475569" stroke="#475569" stroke-width="2"/><text x="590" y="474" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">$75</text><rect x="760" y="197" width="375" height="343" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="790" y="241" font-size="22" fill="#10243a" font-weight="700" text-anchor="start">Defined-scope subtotal</text><text x="790" y="299" font-size="39" fill="#1d4ed8" font-weight="700" text-anchor="start">$1,224.00</text><text x="790" y="350" font-size="23" fill="#475569" font-weight="400" text-anchor="start">+ 10% = $122.40</text><path d="M790 377 L1105 377" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="790" y="420" font-size="21" fill="#10243a" font-weight="700" text-anchor="start">Partial budget scenario</text><text x="790" y="478" font-size="39" fill="#10243a" font-weight="700" text-anchor="start">$1,346.40</text><text x="65" y="560" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Materials: $350 pavers + $90 base + $144 edging = $584</text><path d="M52 603 L1148 603" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="52" y="638" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Excludes bedding, jointing, anchors, excavation, disposal, tax, permits and other unpriced work.</text></g></svg>