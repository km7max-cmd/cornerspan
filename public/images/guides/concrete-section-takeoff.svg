<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>A concrete pour, section by section</title><desc>Two adjoining rectangles · one opening · no double-counted overlap</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="675" fill="#f8fafc"/><text x="52" y="42" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">CORNERSPAN  /  FIELD NOTES</text><text x="52" y="104" font-size="36" fill="#10243a" font-weight="700" text-anchor="start">A concrete pour, section by section</text><text x="52" y="143" font-size="20" fill="#475569" font-weight="400" text-anchor="start">Two adjoining rectangles · one opening · no double-counted overlap</text><rect x="75" y="222" width="440" height="264" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="515" y="354" width="176" height="132" rx="0" fill="#cffafe" stroke="#0e7490" stroke-width="2"/><rect x="141" y="398" width="66" height="44" rx="0" fill="white" stroke="#c2410c" stroke-width="2"/><text x="295" y="300" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">SECTION A</text><text x="295" y="340" font-size="23" fill="#10243a" font-weight="700" text-anchor="middle">20 × 12 ft = 240 sq ft</text><text x="603" y="391" font-size="21" fill="#10243a" font-weight="700" text-anchor="middle">B: 8 × 6 ft</text><text x="603" y="427" font-size="23" fill="#10243a" font-weight="700" text-anchor="middle">48 sq ft</text><text x="90" y="534" font-size="22" fill="#c2410c" font-weight="700" text-anchor="start">Opening O1: 3 × 2 ft = 6 sq ft</text><path d="M173 444 L173 508" stroke="#c2410c" stroke-width="2" fill="none"/><rect x="750" y="208" width="395" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="774" y="243" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Net surface area</text><text x="774" y="278" font-size="21" fill="#475569" font-weight="400" text-anchor="start">240 + 48 − 6 = 282 sq ft</text><rect x="750" y="331" width="395" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="774" y="366" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">At 4 in example depth</text><text x="774" y="401" font-size="21" fill="#475569" font-weight="400" text-anchor="start">282 × 4 ÷ 12 = 94 cu ft</text><text x="770" y="493" font-size="23" fill="#10243a" font-weight="700" text-anchor="start">Thickened edges:</text><text x="770" y="529" font-size="21" fill="#475569" font-weight="400" text-anchor="start">add only the extra depth.</text><path d="M52 603 L1148 603" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="52" y="638" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Example quantity plan. The specified thickness and thickened edges come from the design.</text></g></svg>