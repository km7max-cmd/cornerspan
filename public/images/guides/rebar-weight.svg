<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect width="960" height="480" rx="24" fill="#0f172a"/><g fill="#fff" font-family="Arial,sans-serif"><text x="48" y="64" font-size="30" font-weight="bold">Rebar weight: count × length × lb/ft</text><text x="48" y="105" font-size="22" fill="#94a3b8">Example: 20 pieces of #4 rebar, each 20 feet long</text><rect x="70" y="182" width="720" height="28" rx="14" fill="#64748b"/><path d="M100 178l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36m50-36l20 36" stroke="#cbd5e1" stroke-width="5"/><path d="M70 240v30m0-15h720m0-15v30" stroke="#60a5fa" stroke-width="3"/><text x="340" y="296" font-size="22">20 ft per piece</text><text x="48" y="370" font-size="32" fill="#93c5fd">20 × 20 × 0.668 = 267.2 lb</text><text x="48" y="425" font-size="20" fill="#94a3b8">Nominal weight before any separate ordering allowance</text></g></svg>
