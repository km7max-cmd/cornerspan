<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Concrete: area × thickness</title><desc>20 × 12 ft slab · example thickness of 4 inches</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="675" fill="#f8fafc"/><text x="52" y="42" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="start">CORNERSPAN  /  FIELD NOTES</text><text x="52" y="104" font-size="36" fill="#10243a" font-weight="700" text-anchor="start">Concrete: area × thickness</text><text x="52" y="143" font-size="20" fill="#475569" font-weight="400" text-anchor="start">20 × 12 ft slab · example thickness of 4 inches</text><path d="M85 280 L425 205 L580 290 L240 365 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><path d="M85 280 L240 365 L240 415 L85 330 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><path d="M240 365 L580 290 L580 340 L240 415 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/><text x="245" y="235" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="start">20 ft</text><text x="80" y="390" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="start">12 ft</text><text x="450" y="400" font-size="26" fill="#c2410c" font-weight="700" text-anchor="start">4 in</text><text x="115" y="500" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">Thickness: 4 ÷ 12 = ⅓ ft</text><rect x="650" y="194" width="470" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="674" y="229" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">1. Measure volume</text><text x="674" y="264" font-size="21" fill="#475569" font-weight="400" text-anchor="start">20 × 12 × ⅓ = 80 cu ft</text><rect x="650" y="311" width="470" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="674" y="346" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">2. Convert to cubic yards</text><text x="674" y="381" font-size="21" fill="#475569" font-weight="400" text-anchor="start">80 ÷ 27 ≈ 2.96 cu yd</text><rect x="650" y="428" width="470" height="96" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="674" y="463" font-size="24" fill="#10243a" font-weight="700" text-anchor="start">3. Plan the order</text><text x="674" y="498" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Add only the chosen allowance</text><path d="M52 603 L1148 603" stroke="#cbd5e1" stroke-width="2" fill="none"/><text x="52" y="638" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Quantity illustration only. Slab thickness must come from the project design.</text></g></svg>